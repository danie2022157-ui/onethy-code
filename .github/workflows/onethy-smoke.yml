name: onethy-smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: onethy regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GITHUB_ACTIONS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate Windows complete uninstaller (isolated test profile)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'uninstall.ps1'), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          $sandbox = Join-Path $env:RUNNER_TEMP "onethy-uninstall-ci"
          $testProfile = Join-Path $sandbox "profile"
          $root = Join-Path $testProfile "onethy-code-ci"
          $oldUserProfile = $env:USERPROFILE
          $oldLocalApp = $env:LOCALAPPDATA
          $oldRoamingApp = $env:APPDATA
          New-Item -ItemType Directory -Force -Path (Join-Path $root "bin") | Out-Null
          Copy-Item bin/onethy.js (Join-Path $root "bin/onethy.js")
          Copy-Item install.ps1 (Join-Path $root "install.ps1")
          New-Item -ItemType Directory -Force -Path (Join-Path $testProfile "AppData/Local/omnicode/data") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $testProfile "AppData/Roaming/omnicode") | Out-Null
          try {
            $env:USERPROFILE = $testProfile
            $env:LOCALAPPDATA = Join-Path $testProfile "AppData/Local"
            $env:APPDATA = Join-Path $testProfile "AppData/Roaming"
            $apps = Join-Path $env:LOCALAPPDATA "Microsoft/WindowsApps"
            New-Item -ItemType Directory -Force -Path $apps | Out-Null
            @{ checkout = $root; nodePath = "node.exe" } | ConvertTo-Json -Compress | Set-Content (Join-Path $apps "onethy-config.json")
            Set-Content (Join-Path $apps "onethy.ps1") '$config = Get-Content "onethy-config.json"; Join-Path $config.checkout "bin\onethy.js"'
            Set-Content (Join-Path $apps "onethy.cmd") '@echo off & WindowsPowerShell -File "%~dp0onethy.ps1" %*'
            & ./uninstall.ps1 -Checkout $root -Preview
            if (-not (Test-Path -LiteralPath $root)) { throw "Preview removed the installation!" }
            & ./uninstall.ps1 -Checkout $root -Yes
            if (Test-Path -LiteralPath $root) { throw "Onethy source was not removed" }
            if (Test-Path -LiteralPath (Join-Path $env:LOCALAPPDATA "omnicode")) { throw "Onethy data was not removed" }
            if (Test-Path -LiteralPath (Join-Path $env:APPDATA "omnicode")) { throw "Onethy config was not removed" }
            if (Test-Path -LiteralPath (Join-Path $apps "onethy.cmd")) { throw "Onethy command was not removed" }
            if (Test-Path -LiteralPath (Join-Path $apps "onethy.ps1")) { throw "Onethy PowerShell launcher was not removed" }
            if (Test-Path -LiteralPath (Join-Path $apps "onethy-config.json")) { throw "Onethy launcher config was not removed" }
          } finally {
            $env:USERPROFILE = $oldUserProfile
            $env:LOCALAPPDATA = $oldLocalApp
            $env:APPDATA = $oldRoamingApp
            Set-Location $env:RUNNER_TEMP
            Remove-Item -LiteralPath $sandbox -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Core regression tests
        run: bun --cwd packages/core test test/omni-config.test.ts test/omni-memory-bank.test.ts test/omni-session.test.ts test/omni-model-selection.test.ts test/omni-orchestrator.test.ts test/omni-mission-control.test.ts test/omni-intelligence.test.ts test/omni-task-graph.test.ts test/omni-embeddings.test.ts test/instructions/builtins.test.ts

      - name: MCP configuration and connectivity regressions
        run: bun --cwd packages/core test test/config/normalization.test.ts test/mcp.test.ts

      - name: Subagent integration tests
        run: bun --cwd packages/core test test/tool-subagent.test.ts

      - name: TUI regression tests
        run: bun --cwd packages/tui test test/cli/tui/plugins-dialog.test.tsx test/component/dialog-omni-update.test.tsx test/component/dialog-memory-bank.test.tsx test/util/onethy-update.test.ts test/util/onethy-projects.test.ts test/component/dialog-projects.test.tsx

      - name: Core TypeScript check
        if: runner.os == 'Linux'
        run: bun --cwd packages/core run typecheck:tsc

      - name: MCP CLI configuration regression
        run: bun --cwd packages/cli test test/mcp-config-path.test.ts test/mcp-auth-choices.test.ts

      - name: CLI TypeScript check
        if: runner.os == 'Linux'
        run: bun --cwd packages/cli run typecheck:tsc

      - name: TUI TypeScript check
        if: runner.os == 'Linux'
        run: bun --cwd packages/tui run typecheck:tsc
