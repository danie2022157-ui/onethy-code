name: onethy-smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: onethy regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      GITHUB_ACTIONS: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Core regression tests
        run: bun --cwd packages/core test test/omni-config.test.ts test/omni-memory-bank.test.ts test/omni-session.test.ts test/omni-model-selection.test.ts test/omni-orchestrator.test.ts test/omni-mission-control.test.ts test/omni-intelligence.test.ts test/omni-task-graph.test.ts test/omni-embeddings.test.ts test/instructions/builtins.test.ts

      - name: MCP config and runtime regressions
        run: bun --cwd packages/core test test/config/normalization.test.ts test/mcp.test.ts test/mcp-oauth.test.ts

      - name: CLI MCP tests
        run: bun --cwd packages/cli test test/mcp-auth-choices.test.ts test/mcp-repair.test.ts

      - name: Subagent integration tests
        run: bun --cwd packages/core test test/tool-subagent.test.ts

      - name: TUI regression tests
        run: bun --cwd packages/tui test test/cli/tui/plugins-dialog.test.tsx test/component/dialog-omni-update.test.tsx test/component/dialog-memory-bank.test.tsx test/util/onethy-update.test.ts test/util/onethy-projects.test.ts test/component/dialog-projects.test.tsx

      - name: Core TypeScript check
        if: runner.os == 'Linux'
        run: bun --cwd packages/core run typecheck:tsc

      - name: CLI TypeScript check
        if: runner.os == 'Linux'
        run: bun --cwd packages/cli run typecheck:tsc

      - name: TUI TypeScript check
        if: runner.os == 'Linux'
        run: bun --cwd packages/tui run typecheck:tsc
