name: AITmpl native personalization tests
on:
  pull_request:
    paths:
      - 'packages/cli/src/services/aitmpl-native.*'
      - 'package.json'
      - 'script/aitmpl-personalizations-bootstrap.mjs'
      - 'script/aitmpl-sync.test.mjs'
      - '.github/workflows/aitmpl-native.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cli/src/services/aitmpl-native.*'
      - 'package.json'
      - 'script/aitmpl-personalizations-bootstrap.mjs'
      - 'script/aitmpl-sync.test.mjs'
      - '.github/workflows/aitmpl-native.yml'
jobs:
  personalization-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check packages/cli/src/services/aitmpl-native.mjs
      - run: node --check script/aitmpl-personalizations-bootstrap.mjs
      - run: node --test script/aitmpl-sync.test.mjs
