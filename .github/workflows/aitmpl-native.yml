name: AITmpl native personalization tests
on:
  pull_request:
    paths:
      - 'packages/cli/src/services/aitmpl-native.*'
      - 'packages/cli/src/services/aitmpl-mcp.mjs'
      - 'packages/cli/src/services/aitmpl-agent.mjs'
      - 'package.json'
      - 'script/aitmpl-personalizations-bootstrap.mjs'
      - 'script/aitmpl-sync.test.mjs'
      - '.github/workflows/aitmpl-native.yml'
  push:
    branches: [main]
    paths:
      - 'packages/cli/src/services/aitmpl-native.*'
      - 'packages/cli/src/services/aitmpl-mcp.mjs'
      - 'packages/cli/src/services/aitmpl-agent.mjs'
      - 'package.json'
      - 'script/aitmpl-personalizations-bootstrap.mjs'
      - 'script/aitmpl-sync.test.mjs'
      - '.github/workflows/aitmpl-native.yml'
jobs:
  personalization-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check packages/cli/src/services/aitmpl-native.mjs
      - run: node --check packages/cli/src/services/aitmpl-mcp.mjs
      - run: node --check packages/cli/src/services/aitmpl-agent.mjs
      - run: node --check script/aitmpl-personalizations-bootstrap.mjs
      - run: node --test script/aitmpl-sync.test.mjs
      - name: Verify real catalog import preview (no writes)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { syncAITmpl } from './packages/cli/src/services/aitmpl-native.mjs'
          const report = await syncAITmpl({ type: 'mcps' })
          if (report.ready < 1 || report.errors.length) {
            throw new Error('Live AITmpl MCP templates were not discovered')
          }
          console.log('Native personalization catalog preview verified:', report.ready, 'MCP definitions')
          NODE
