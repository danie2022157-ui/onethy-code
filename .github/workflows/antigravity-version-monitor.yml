name: antigravity-version-monitor

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8 # v4.3.1
      - name: Check upstream stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline=$(sed -nE 's/.*ANTIGRAVITY_BASELINE = "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' packages/core/src/config/plugin/antigravity-native.ts | head -1)
          latest=$(npm view @cortexkit/opencode-antigravity-auth version)
          if [[ ! "$baseline" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ ! "$latest" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid registry or baseline version"; exit 1
          fi
          echo "Native compatible baseline: $baseline; latest upstream: $latest"
          current_major=${baseline%%.*}
          latest_major=${latest%%.*}
          if (( latest_major <= current_major )); then
            echo "Same-major releases are handled by the native npm updater while OnethyCode runs."
            exit 0
          fi
          title="Antigravity Auth major-version migration review"
          existing=$(gh issue list --state open --limit 100 --json title --jq '.[] | select(.title == "Antigravity Auth major-version migration review") | .title')
          if [[ -n "$existing" ]]; then
            echo "Review issue already exists."; exit 0
          fi
          gh issue create --title "$title" --body "CortexKit has released $latest; OnethyCode currently supports ^$baseline. Major updates are held because the upstream OAuth account store may require an offline migration. Review source, migrations and rollback; update the native range only after passing compatibility tests. Do not post credentials in this issue."
